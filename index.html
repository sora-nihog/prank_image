
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SORA CODE RUNNER</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #080d18;
  color: #00ff88;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 15px;
}

h1 {
  font-size: 27px;
  text-shadow: 0 0 12px #00ff88;
}

.subtitle {
  color: #8999aa;
}

.panel {
  background: #111b2b;
  border: 1px solid #174c40;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 12px;
  font-weight: bold;
}

textarea {
  width: 100%;
  height: 270px;
  resize: vertical;
  background: #050a12;
  color: #00ff88;
  border: 1px solid #225b49;
  border-radius: 8px;
  padding: 12px;
  font-family: monospace;
  font-size: 14px;
  outline: none;
}

button {
  padding: 12px 20px;
  margin: 10px 5px 0 0;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

.run {
  background: #00ff88;
  color: #00140b;
}

.reset {
  background: #27374b;
  color: white;
}

iframe {
  width: 100%;
  height: 250px;
  background: white;
  border: none;
  border-radius: 8px;
}

footer {
  text-align: center;
  color: #657487;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <h1>⚡ SORA CODE RUNNER</h1>
  <p class="subtitle">Write • Run • Create</p>
</header>

<div class="panel">
  <label>💻 Your Code</label>

  <textarea id="editor" spellcheck="false"><!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #101827;
  color: #00ff88;
  text-align: center;
  font-family: Arial;
  padding: 30px;
}
</style>
</head>

<body>
<h1>Hello Sora!</h1>
<p>Welcome to my code runner.</p>
<button onclick="alert('Sora Code Runner!')">
Click Me
</button>
</body>
</html></textarea>

  <button class="run" onclick="runCode()">
    ▶ RUN CODE
  </button>

  <button class="reset" onclick="resetCode()">
    ↺ RESET
  </button>
</div>

<div class="panel">
  <label>🖥️ Output Preview</label>
  <iframe id="output" sandbox="allow-scripts"></iframe>
</div>

<footer>
  SORA CODE RUNNER • Made with HTML, CSS & JavaScript
</footer>

<script>
const editor = document.getElementById("editor");
const output = document.getElementById("output");

const starterCode = editor.value;

function runCode() {
  output.srcdoc = editor.value;
}

function resetCode() {
  editor.value = starterCode;
  runCode();
}

// Run the starter code
runCode();
</script>

</body>
</html>
