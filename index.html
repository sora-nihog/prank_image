
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SORA PYTHON RUNNER</title>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #080d18;
  color: #00ff88;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 15px;
}

h1 {
  text-shadow: 0 0 12px #00ff88;
}

.panel {
  background: #111b2b;
  border: 1px solid #174c40;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}

textarea {
  width: 100%;
  height: 280px;
  background: #050a12;
  color: #00ff88;
  border: 1px solid #225b49;
  border-radius: 10px;
  padding: 15px;
  font-size: 17px;
  font-family: monospace;
  resize: vertical;
}

button {
  border: none;
  border-radius: 10px;
  padding: 15px 22px;
  margin: 12px 5px 0 0;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.run {
  background: #00ff88;
  color: #00140b;
}

.reset {
  background: #27374b;
  color: white;
}

button:disabled {
  opacity: 0.5;
}

#output {
  background: #ffffff;
  color: #111111;
  min-height: 180px;
  padding: 18px;
  border-radius: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: monospace;
  font-size: 17px;
}

#status {
  color: #9baaba;
  font-size: 13px;
  margin-top: 12px;
}

footer {
  text-align: center;
  color: #718096;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <h1>🐍 SORA PYTHON RUNNER</h1>
  <p>Write • Run • Create</p>
</header>

<div class="panel">

  <label>💻 Your Python Code</label>

  <textarea id="editor" spellcheck="false">name = "sora"
print(name)</textarea>

  <button class="run" id="runButton" onclick="runCode()">
    ▶ RUN CODE
  </button>

  <button class="reset" onclick="resetCode()">
    ↺ RESET
  </button>

  <p id="status">Python is ready to load.</p>

</div>

<div class="panel">

  <label>🖥️ Output</label>

  <pre id="output">Your output will appear here...</pre>

</div>

<footer>
  SORA PYTHON RUNNER
  <p>Made with HTML, CSS & Python</p>
</footer>

<script>
let pyodide = null;

const editor = document.getElementById("editor");
const output = document.getElementById("output");
const status = document.getElementById("status");
const runButton = document.getElementById("runButton");

async function runCode() {

  runButton.disabled = true;
  output.textContent = "";
  status.textContent = "⏳ Loading Python...";

  try {

    if (!pyodide) {
      pyodide = await loadPyodide();
    }

    let result = "";

    pyodide.setStdout({
      batched: (text) => {
        result += text + "\n";
      }
    });

    pyodide.setStderr({
      batched: (text) => {
        result += text + "\n";
      }
    });

    await pyodide.runPythonAsync(editor.value);

    output.textContent = result || "Code executed successfully!";
    status.textContent = "✅ Execution completed";

  } catch (error) {

    output.textContent = String(error);
    status.textContent = "❌ Error";

  } finally {
    runButton.disabled = false;
  }
}

function resetCode() {

  editor.value = 'name = "sora"\nprint(name)';
  output.textContent = "Your output will appear here...";
  status.textContent = "Code reset successfully.";

}
</script>

</body>
</html>
